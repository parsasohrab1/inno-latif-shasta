# GitHub Actions CI برای دوقلوی دیجیتال لطیف
# در هر push و PR: lint + test + build Docker image
name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---- Job 1: تست Python ----
  test:
    name: Lint + Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio ruff

      - name: Lint with ruff
        run: |
          ruff check app/ tests/ || true  # Non-blocking برای این پروژه
          echo "Lint check completed (warnings allowed)"

      - name: Run tests
        env:
          LATIF_OPCUA_INTERVAL_SEC: 1
          LATIF_OPCUA_SIM_ENABLED: true
          LATIF_HISTORIAN_BACKEND: memory
          LATIF_LOG_LEVEL: warning
          PYTHONPATH: .
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          retention-days: 7

  # ---- Job 2: ساخت Docker image ----
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: latif-digital-twin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test image starts
        run: |
          docker run --rm -d -p 8080:8000 --name latif-test latif-digital-twin:ci
          sleep 5
          curl -sS http://127.0.0.1:8080/api/health | grep -q "ok" || (echo "Health check failed" && docker logs latif-test && exit 1)
          echo "✅ Image starts and responds to /api/health"
          docker stop latif-test || true

  # ---- Job 3: تست‌های اسکریپت (تولید داده و نمودار) ----
  scripts-test:
    name: Test data/figure scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # تلاش برای نصب فونت Vazirmatn (اختیاری — اسکریپت با fallback به DejaVu Sans هم کار می‌کند)
          sudo apt-get update
          sudo apt-get install -y unzip fontconfig
          mkdir -p ~/.local/share/fonts /usr/share/fonts/truetype/vazirmatn
          # روش ۱: دانلود مستقیم از release رسمی
          if curl -sSL -o /tmp/v.zip "https://github.com/rastikerdar/vazirmatn/releases/download/v33.003/Vazirmatn-v33.003.zip"; then
            unzip -q /tmp/v.zip -d /tmp/vz || true
            # جستجوی فایل‌های ttf در هر زیرشاخه
            find /tmp/vz -name "Vazirmatn-*.ttf" -exec cp {} ~/.local/share/fonts/ \; 2>/dev/null || true
            find /tmp/vz -name "Vazirmatn-*.ttf" -exec sudo cp {} /usr/share/fonts/truetype/vazirmatn/ \; 2>/dev/null || true
          fi
          fc-cache -f || true
          echo "=== installed Vazirmatn fonts ==="
          fc-list | grep -i vazir || echo "(Vazirmatn not installed — scripts will use DejaVu Sans fallback)"

      - name: Run MPC simulation test
        env:
          PYTHONPATH: .
        run: python scripts/test_mpc.py
